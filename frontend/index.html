<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <span class="header-title">VT tool</span>
        </div>
    </header>

    <main class="container">
        <section class="translate-section">
            <textarea
                id="source-text"
                class="textarea"
                placeholder="Wpisz lub wklej tekst..."
                maxlength="5000"
                rows="4"
            ></textarea>

            <button id="translate-btn" class="btn btn-primary">
                Tłumacz
            </button>

            <button id="mic-btn" class="btn btn-mic">
                &#127908; Mów
            </button>

            <div id="mic-status" class="mic-status" hidden></div>

            <div id="error-message" class="error-message" hidden></div>

            <div id="result-area" class="result-area" hidden>
                <div class="result-entry">
                    <div class="result-pl" id="result-pl"></div>
                    <div class="result-en" id="result-en"></div>
                    <button id="result-play-btn" class="btn btn-play" title="Odtwórz wymowę">
                        <span class="play-icon">&#9654;</span> Play
                    </button>
                </div>
            </div>
        </section>

        <section class="history-section">
            <h2 class="history-header">Ostatnie</h2>
            <ul id="history-list" class="history-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
